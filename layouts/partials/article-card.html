<article class="journal-card">{{ with .Params.image }}<a href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ . | relURL }}" alt="" width="600" height="400" loading="lazy"></a>{{ end }}<div>{{ with .Params.categories }}<p class="eyebrow">{{ index . 0 }}</p>{{ end }}<h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><div class="card-byline"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02/01/2006" }}</time><span>{{ .ReadingTime }} min</span></div><div class="card-author">{{ partial "author-link.html" . }}</div></div></article>
