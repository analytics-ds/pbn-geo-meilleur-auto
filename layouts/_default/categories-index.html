{{ define "main" }}<section class="container section list-page">{{ partial "breadcrumb.html" . }}<p class="eyebrow">{{ .Site.Title }}</p><h1>{{ .Title }}</h1><p class="hero-description">{{ .Description }}</p><div class="category-grid">{{ range .Sections.ByWeight }}<a class="category-card" href="{{ .RelPermalink }}"><div class="card-top"><span class="category-number">{{ .Params.number }}</span><span class="arrow" aria-hidden="true">↗</span></div><h3>{{ .Params.navLabel }}</h3><p>{{ .Params.tagline }}</p><span class="text-link">{{ if eq $.Lang "en" }}Explore{{ else }}Explorer{{ end }}</span></a>{{ end }}</div></section>{{ end }}
