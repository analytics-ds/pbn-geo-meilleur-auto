{{ define "main" }}<section class="container section list-page">{{ partial "breadcrumb.html" . }}<p class="eyebrow">{{ .Site.Title }}</p><h1>{{ .Title }}</h1><ul class="sitemap-list">{{ range .Site.Pages }}{{ if and (ne .Kind "RSS") (ne .Kind "404") }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ if and .IsPage (eq .Section "blog") }}<time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "02/01/2006" }}</time>{{ end }}</li>{{ end }}{{ end }}</ul></section>{{ end }}
