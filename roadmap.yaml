# Roadmap editoriale evergreen — Meilleur Choix Auto (meilleur-choix-auto.com)
#
# Pilote la publication automatique (skill .claude/skills/create-article-auto, routine cloud).
# Langue principale : fr (+ EN auto dans /en/)
#
# CADENCE : 2 articles/semaine, mardi et vendredi, 1h UTC (3h Paris en ete).
#
# ORDRE : les mots-cles sont consommes dans l'ordre des scheduled_date croissantes.
# L'agent ne lit PAS l'ordre du fichier, il trie par date. Pour changer l'ordre de
# publication, il faut donc changer les dates, pas deplacer les blocs.
#
# CHAMPS
# ------
# Edites par l'humain :
#   kw              Mot-cle principal SEO cible (langue principale)
#   category        Categorie editoriale (reconnue par les `categoryKeys` des pages de rubrique)
#   volume          Volume mensuel de recherche (informatif, ignore par l'agent)
#   kd              Difficulte du mot-cle 0-100 (informatif, ignore par l'agent)
#   scheduled_date  YYYY-MM-DD, date a partir de laquelle l'agent peut publier
#   status          todo | done | failed
#
# Remplis par l'agent (ne pas toucher sauf pour debloquer un failed) :
#   published_date, published_url_fr, published_url_en, error
#
# COMMENT AJOUTER UNE ENTREE
# --------------------------
# 1. Copier un bloc existant, renseigner kw / category / scheduled_date
# 2. Laisser status: todo et les autres champs a null
# 3. Commit + push sur main. La prochaine execution cron eligible prendra l'entree.
#
# DEBLOQUER UN FAILED
# -------------------
# Lire le champ error, corriger, repasser status: todo et error: null, commit + push.
#
# LES ENTREES `done` DATEES D'AVANT LE 2026-09-22
# ------------------------------------------------------------
# Elles marquent des sujets deja couverts et servent a ne pas les reprendre.
# L'agent les ignore. Ne pas les repasser en todo sans une raison.

